name: rave-circle
options:
  bundleIdPrefix: app.ravecircle.mobile
  deploymentTarget:
    iOS: 13.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: RaveCircle
      PRODUCT_BUNDLE_IDENTIFIER: app.ravecircle.mobile
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: NKJ8W74Z5X
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  rave-circle_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: rave-circle_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: rave-circle_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        NSLocationWhenInUseUsageDescription: RaveCircle uses your location to show nearby events.
        NSLocalNetworkUsageDescription: RaveCircle needs local network access to connect to the development server during testing.
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
    entitlements:
      path: rave-circle_iOS/rave-circle_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ENABLE_USER_SCRIPT_SANDBOXING: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          set -e

          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:$PATH"

          _ensure_tool_in_path() {
            _tool_name="$1"
            shift
            for _bin_dir in "$@"; do
              [ -n "${_bin_dir}" ] || continue
              if [ -x "${_bin_dir}/${_tool_name}" ]; then
                export PATH="${_bin_dir}:$PATH"
                return 0
              fi
            done
            return 1
          }

          _CURRENT_USER="$(/usr/bin/id -un)"
          _USER_HOME="$(/usr/bin/dscl . -read "/Users/${_CURRENT_USER}" NFSHomeDirectory 2>/dev/null | /usr/bin/awk '{print $2}')"
          [ -n "${_USER_HOME}" ] || _USER_HOME="$HOME"

          if ! command -v node >/dev/null 2>&1; then
            _ensure_tool_in_path "node" "/opt/homebrew/bin" "/usr/local/bin" || true
          fi

          if ! command -v node >/dev/null 2>&1; then
            echo "error: node not found in PATH for Xcode script phase."
            echo "error: PATH=$PATH"
            exit 1
          fi

          if ! command -v npm >/dev/null 2>&1; then
            _ensure_tool_in_path "npm" "/opt/homebrew/bin" "/usr/local/bin" || true
          fi

          if ! command -v npm >/dev/null 2>&1; then
            echo "error: npm not found in PATH for Xcode script phase."
            echo "error: PATH=$PATH"
            exit 1
          fi

          _tauri_log="$(mktemp)"
          set +e
          npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR:-} ${ARCHS:?} >"${_tauri_log}" 2>&1
          _tauri_status=$?
          set -e
          cat "${_tauri_log}"

          if [ "${_tauri_status}" -eq 0 ]; then
            exit 0
          fi

          if ! /usr/bin/grep -Eq "failed to read CLI options|Connection refused|TAURI_OPTIONS_SERVER_ADDR" "${_tauri_log}"; then
            exit "${_tauri_status}"
          fi

          echo "warn: falling back to direct cargo build for Xcode script phase"

          if ! command -v cargo >/dev/null 2>&1; then
            _ensure_tool_in_path "cargo" "${_USER_HOME}/.cargo/bin" "$HOME/.cargo/bin" "/opt/homebrew/bin" "/usr/local/bin" || true
          fi

          if ! command -v cargo >/dev/null 2>&1; then
            echo "error: cargo not found in PATH and tauri xcode bridge unavailable."
            echo "error: Install Rust with 'rustup toolchain install stable' and reopen Xcode."
            echo "error: PATH=$PATH"
            exit 1
          fi

          _cfg_lc="$(echo "${CONFIGURATION:?}" | tr '[:upper:]' '[:lower:]')"

          for _arch in ${ARCHS:?}; do
            case "${_arch}" in
              arm64)
                if [ "${PLATFORM_NAME:-}" = "iphonesimulator" ]; then
                  _target="aarch64-apple-ios-sim"
                else
                  _target="aarch64-apple-ios"
                fi
                ;;
              x86_64)
                _target="x86_64-apple-ios"
                ;;
              *)
                echo "error: unsupported ARCHS entry '${_arch}' for fallback build"
                exit 1
                ;;
            esac

            _release_flag=""
            if [ "${_cfg_lc}" = "release" ]; then
              _release_flag="--release"
            fi

            cargo build --manifest-path ../../Cargo.toml --target "${_target}" ${_release_flag}

            _src="../../target/${_target}/${_cfg_lc}/librave_circle_lib.a"
            _dst_dir="./Externals/${_arch}/${_cfg_lc}"
            _dst="${_dst_dir}/libapp.a"
            /bin/mkdir -p "${_dst_dir}"
            /bin/cp "${_src}" "${_dst}"
          done
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
